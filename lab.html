<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Little Wonder — Level Lab</title>
    <style>
      body { margin: 0; padding: 16px 20px 60px; font: 14px/1.4 system-ui, sans-serif; background: #f4f1fa; color: #2e2440; }
      h1 { font-size: 22px; margin: 20px 0 6px; }
      h1 small, h2 small { font-weight: 400; color: #7b6d93; font-size: 13px; }
      h2 { font-size: 16px; margin: 0 0 8px; }
      .level { background: #fff; border-radius: 14px; padding: 14px; margin: 12px 0; box-shadow: 0 2px 10px #2e244014; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
      figure { margin: 0; }
      figure svg, figure canvas { display: block; border-radius: 8px; box-shadow: 0 0 0 1px #0001; }
      figcaption { font-size: 12px; color: #7b6d93; margin-top: 4px; }
      .labels { margin: 10px 0 0; padding-left: 22px; font-size: 13px; }
      .labels i { color: #9a8bb3; font-style: normal; }
      .labels span { color: #7b6d93; }
      .sticker { display: inline-flex; align-items: center; gap: 10px; margin-top: 8px; background: repeating-conic-gradient(#f3eefb 0 25%, #fff 0 50%) 0 0/16px 16px; border-radius: 10px; padding: 6px 12px 6px 6px; }
      .swatch { width: 200px; height: 200px; border-radius: 12px; display: grid; place-items: center; }
      .swatch b { color: #fff; padding: 4px 8px; border-radius: 8px; }
      .err { color: #c0124f; white-space: pre-wrap; margin: 4px 0; }
      .warn { color: #a06000; margin: 4px 0; }
      table { font-size: 12px; color: #6b5c84; margin-top: 6px; }
      td { padding: 1px 10px 1px 0; }
    </style>
  </head>
  <body>
    <main id="lab"></main>
    <script type="module" src="/src/dev/lab.ts"></script>
  </body>
</html>
